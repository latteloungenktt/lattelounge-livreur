<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Latte Lounge Delivery</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LL Delivery">
<meta name="theme-color" content="#0A0A0A">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&family=DM+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0A;--surface:#161616;--card:#1E1E1E;--border:#2A2A2A;
    --gold:#C9A84C;--gold2:#F0D080;--red:#D64045;--green:#3DAA6E;
    --orange:#E07B39;--blue:#3A7BD5;--purple:#8B5CF6;--text:#F0EDE8;--muted:#888;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:40px;}

  /* HEADER */
  header{background:linear-gradient(135deg,#1a0f00,#2d1a00,#1a0f00);border-bottom:2px solid var(--orange);padding:14px 20px;text-align:center;}
  .hlogo{font-family:'Playfair Display',serif;font-size:22px;font-weight:900;color:var(--orange);letter-spacing:2px;}
  .hsub{font-size:11px;color:var(--muted);letter-spacing:3px;margin-top:3px;}
  .hclock{font-family:'DM Mono',monospace;font-size:13px;color:var(--gold2);margin-top:4px;}

  /* FORM SECTION */
  .form-section{padding:20px;}
  .form-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px;}
  .form-title{font-family:'Playfair Display',serif;font-size:18px;color:var(--orange);margin-bottom:4px;}
  .form-sub{font-size:12px;color:var(--muted);margin-bottom:18px;}
  .input-field{width:100%;padding:13px 14px;background:var(--card);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s;margin-bottom:12px;}
  .input-field:focus{border-color:var(--orange);}
  .input-field::placeholder{color:var(--muted);}
  .input-field.code{font-family:'DM Mono',monospace;font-size:18px;letter-spacing:4px;text-transform:uppercase;text-align:center;}
  .btn-search{width:100%;padding:15px;background:var(--orange);border:none;border-radius:12px;color:#fff;font-size:16px;font-weight:700;cursor:pointer;transition:all .2s;font-family:'Playfair Display',serif;letter-spacing:1px;}
  .btn-search:hover{filter:brightness(1.1);transform:translateY(-1px);}
  .btn-search:active{transform:scale(.98);}

  /* RESULT */
  .result-section{padding:0 20px;}
  .error-box{background:rgba(214,64,69,.1);border:1px solid var(--red);border-radius:12px;padding:16px;text-align:center;color:var(--red);font-size:14px;}

  /* ORDER CARD */
  .order-card{background:var(--surface);border:2px solid var(--orange);border-radius:16px;overflow:hidden;animation:pop .3s ease;}
  @keyframes pop{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}

  .oc-header{background:linear-gradient(135deg,#1a0f00,#2d1a00);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);}
  .oc-code{font-family:'DM Mono',monospace;font-size:16px;color:var(--orange);font-weight:700;letter-spacing:2px;}
  .oc-status{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;}
  .status-prep{background:rgba(224,123,57,.15);color:var(--orange);border:1px solid var(--orange);}
  .status-livr{background:rgba(139,92,246,.15);color:var(--purple);border:1px solid var(--purple);}
  .status-done{background:rgba(61,170,110,.15);color:var(--green);border:1px solid var(--green);}

  /* Client info */
  .oc-client{padding:14px 16px;border-bottom:1px solid var(--border);background:var(--card);}
  .oc-client-title{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:8px;}
  .oc-client-name{font-size:15px;font-weight:700;color:var(--text);}
  .oc-client-phone{font-family:'DM Mono',monospace;font-size:14px;color:var(--gold2);margin-top:4px;}
  .oc-client-pay{font-size:12px;color:var(--muted);margin-top:4px;}

  /* Items */
  .oc-items{padding:12px 16px;border-bottom:1px solid var(--border);}
  .oc-items-title{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:8px;}
  .oc-item{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--border);color:var(--muted);}
  .oc-item:last-child{border-bottom:none;}
  .oc-total{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border);}
  .oc-total-label{font-size:12px;color:var(--muted);}
  .oc-total-val{font-family:'DM Mono',monospace;font-size:18px;color:var(--orange);font-weight:700;}

  /* Location */
  .oc-location{padding:12px 16px;border-bottom:1px solid var(--border);}
  .oc-location-title{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:8px;}
  .oc-location-dist{font-size:13px;color:var(--text);margin-bottom:6px;}
  .btn-maps{width:100%;padding:12px;background:var(--blue);border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
  .btn-maps:hover{filter:brightness(1.1);}

  /* Notes */
  .oc-notes{padding:10px 16px;font-size:12px;color:var(--gold2);background:rgba(201,168,76,.05);border-bottom:1px solid var(--border);}

  /* Already assigned */
  .oc-assigned{padding:12px 16px;background:rgba(139,92,246,.05);border-bottom:1px solid var(--border);}
  .oc-assigned-title{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:6px;}
  .oc-assigned-name{font-size:14px;font-weight:700;color:var(--purple);}
  .oc-assigned-phone{font-family:'DM Mono',monospace;font-size:13px;color:var(--purple);margin-top:2px;}

  /* Actions */
  .oc-actions{padding:14px 16px;display:flex;flex-direction:column;gap:8px;}
  .btn-prendre{padding:14px;background:var(--orange);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;font-family:'Playfair Display',serif;}
  .btn-prendre:hover{filter:brightness(1.1);}
  .btn-livrer{padding:14px;background:var(--green);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;font-family:'Playfair Display',serif;}
  .btn-livrer:hover{filter:brightness(1.1);}
  .btn-new{padding:12px;background:transparent;border:1px solid var(--border);border-radius:12px;color:var(--muted);font-size:14px;cursor:pointer;}
  .btn-new:hover{border-color:var(--orange);color:var(--orange);}

  /* Success */
  .success-box{background:rgba(61,170,110,.1);border:1px solid var(--green);border-radius:12px;padding:16px;text-align:center;color:var(--green);font-size:14px;font-weight:700;margin-bottom:12px;}
</style>
</head>
<body>

<header>
  <div style="font-size:32px;margin-bottom:6px;">🛵</div>
  <div class="hlogo">Latte Lounge Delivery</div>
  <div class="hsub">ESPACE LIVREUR</div>
  <div class="hclock" id="clock">--:--:--</div>
</header>

<div class="form-section">
  <div class="form-card">
    <div class="form-title">Prendre une commande</div>
    <div class="form-sub">Entrez vos informations et le numéro de commande</div>
    <input class="input-field" type="text" id="livreurNom" placeholder="Votre nom complet">
    <input class="input-field" type="tel" id="livreurTel" placeholder="Votre numéro de téléphone">
    <input class="input-field code" type="text" id="codeCommande" placeholder="CODE" maxlength="6" oninput="this.value=this.value.toUpperCase()">
    <button class="btn-search" onclick="rechercherCommande()">🔍 Rechercher la commande</button>
  </div>
</div>

<div class="result-section" id="resultSection"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const FB={
  apiKey:"AIzaSyBZnorgx0FgFzQk-ynMWLWAGblA1797wL8",
  authDomain:"latte-lounge-caisse.firebaseapp.com",
  databaseURL:"https://latte-lounge-caisse-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"latte-lounge-caisse",
  storageBucket:"latte-lounge-caisse.firebasestorage.app",
  messagingSenderId:"864095614648",
  appId:"1:864095614648:web:4d827e02772b5b73fca64d"
};
const app=initializeApp(FB);
const db=getDatabase(app);

// Clock
setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleTimeString('fr-FR'),1000);
document.getElementById('clock').textContent=new Date().toLocaleTimeString('fr-FR');

let currentOrderKey=null;
let currentUnsub=null;

window.rechercherCommande=function(){
  const nom=document.getElementById('livreurNom').value.trim();
  const tel=document.getElementById('livreurTel').value.trim();
  const code=document.getElementById('codeCommande').value.trim().toUpperCase();
  const result=document.getElementById('resultSection');

  if(!nom){alert('Veuillez entrer votre nom.');return;}
  if(!tel){alert('Veuillez entrer votre numéro de téléphone.');return;}
  if(!code||code.length<4){alert('Veuillez entrer le numéro de commande.');return;}

  result.innerHTML='<div style="text-align:center;color:var(--muted);padding:30px;font-size:14px;">🔍 Recherche en cours...</div>';

  // Unsubscribe previous
  if(currentUnsub) currentUnsub();

  // Search by trackingCode
  const { query, orderByChild, equalTo } = window._fbFns||{};
  import("https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js").then(({query,orderByChild,equalTo,onValue})=>{
    const q=query(ref(db,'commandes'),orderByChild('trackingCode'),equalTo(code));
    currentUnsub=onValue(q,snap=>{
      if(!snap.exists()){
        result.innerHTML='<div class="error-box">❌ Commande introuvable.<br><small>Vérifiez le numéro de commande.</small></div>';
        return;
      }
      const entries=Object.entries(snap.val());
      const [key,order]=entries[0];
      currentOrderKey=key;
      renderOrder(order,key,nom,tel);
    },{onlyOnce:false});
  });
};

function renderOrder(order,key,livreurNom,livreurTel){
  const result=document.getElementById('resultSection');

  // Status badge
  const statusMap={
    envoye:{label:'📤 Nouvelle',cls:'status-prep'},
    confirme:{label:'✅ Confirmée',cls:'status-prep'},
    preparation:{label:'🍳 En préparation',cls:'status-prep'},
    en_livraison:{label:'🛵 En livraison',cls:'status-livr'},
    livre:{label:'🎉 Livrée',cls:'status-done'},
    annule:{label:'❌ Annulée',cls:'status-prep'},
  };
  const st=statusMap[order.status]||{label:order.status,cls:'status-prep'};

  const itemsHtml=(order.items||[]).map(it=>`<div class="oc-item"><span>${it.name} × ${it.qty}</span><span>${it.subtotal} MRU</span></div>`).join('');

  const locationHtml=order.localisation?`
    <div class="oc-location">
      <div class="oc-location-title">📍 Localisation client</div>
      <div class="oc-location-dist">Distance : <strong style="color:var(--orange)">${order.localisation.distance} km</strong></div>
      <button class="btn-maps" onclick="window.open('${order.localisation.mapsLink}','_blank')">
        🗺 Ouvrir dans Google Maps
      </button>
    </div>`:'';

  // Assigned driver info
  const assignedHtml=order.livreur?`
    <div class="oc-assigned">
      <div class="oc-assigned-title">🛵 Livreur assigné</div>
      <div class="oc-assigned-name">👤 ${order.livreur.nom}</div>
      <div class="oc-assigned-phone">📞 ${order.livreur.tel}</div>
    </div>`:'';

  // Actions
  let actionsHtml='';
  if(order.status==='livre'||order.status==='annule'){
    actionsHtml=`<div class="success-box">${order.status==='livre'?'🎉 Cette commande a déjà été livrée !':'❌ Cette commande a été annulée.'}</div>`;
  } else if(order.status==='en_livraison' && order.livreur){
    // Check if this driver is assigned
    actionsHtml=`
      <button class="btn-livrer" onclick="marquerLivre('${key}')">🎉 Marquer comme livrée</button>
      <button class="btn-new" onclick="resetForm()">🔄 Nouvelle recherche</button>`;
  } else if(!order.livreur || order.status!=='en_livraison'){
    actionsHtml=`
      <button class="btn-prendre" onclick="prendreEnCharge('${key}','${livreurNom.replace(/'/g,"\\'")}','${livreurTel}')">🛵 Prendre en charge cette livraison</button>
      <button class="btn-new" onclick="resetForm()">🔄 Nouvelle recherche</button>`;
  }

  result.innerHTML=`
    <div class="order-card">
      <div class="oc-header">
        <div class="oc-code">#${order.trackingCode}</div>
        <span class="oc-status ${st.cls}">${st.label}</span>
      </div>
      <div class="oc-client">
        <div class="oc-client-title">👤 Informations client</div>
        <div class="oc-client-name">${order.clientName||'—'}</div>
        <div class="oc-client-phone">📞 ${order.clientPhone||'—'}</div>
        <div class="oc-client-pay">💳 ${order.paiement||''}</div>
      </div>
      <div class="oc-items">
        <div class="oc-items-title">🍽 Articles commandés</div>
        ${itemsHtml}
      </div>
      <div class="oc-total">
        <div>
          <div class="oc-total-label">${order.fraisLivraison?'Livraison incluse : '+order.fraisLivraison+' MRU':''}</div>
        </div>
        <div class="oc-total-val">TOTAL : ${order.total} MRU</div>
      </div>
      ${locationHtml}
      ${order.notes?`<div class="oc-notes">📝 ${order.notes}</div>`:''}
      ${assignedHtml}
      <div class="oc-actions">${actionsHtml}</div>
    </div>`;
}

window.prendreEnCharge=async function(key,nom,tel){
  if(!confirm(`Confirmer la prise en charge de cette commande ?\n\nLivreur : ${nom}\nTél : ${tel}`))return;
  try{
    await update(ref(db,`commandes/${key}`),{
      status:'en_livraison',
      livreur:{nom,tel}
    });
    document.querySelector('.btn-prendre').textContent='✅ Prise en charge confirmée !';
  }catch(e){alert('Erreur: '+e.message);}
};

window.marquerLivre=async function(key){
  if(!confirm('Confirmer la livraison de cette commande ?'))return;
  try{
    await update(ref(db,`commandes/${key}`),{status:'livre'});
  }catch(e){alert('Erreur: '+e.message);}
};

window.resetForm=function(){
  document.getElementById('codeCommande').value='';
  document.getElementById('resultSection').innerHTML='';
  document.getElementById('codeCommande').focus();
  if(currentUnsub){currentUnsub();currentUnsub=null;}
};
</script>
</body>
</html>
